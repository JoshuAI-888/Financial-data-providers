name: Deploy GitHub Pages

on:
  push:
    branches: [claude/milford-fmp-data-strategy-5nhxlm]
    paths:
      - index.html
      - idp_evaluation.html
      - financial_data_providers_landscape.html
      - provider-landscape/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp idp_evaluation.html _site/idp_evaluation.html
          cp financial_data_providers_landscape.html _site/financial_data_providers_landscape.html
          cp -r provider-landscape _site/provider-landscape

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
